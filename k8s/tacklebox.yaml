apiVersion: apps/v1
kind: Deployment
metadata:
  name: tacklebox-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "tacklebox"
  template:
    metadata:
      labels:
        app: "tacklebox"
    spec:
      containers:
      # NATIVE APP CONTAINER (Simple, clean, single-container setup)
      - name: my-tacklebox
        image: my-tacklebox:v27
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: backend-log-storage
          mountPath: /usr/src/app/logs    # Where Winston dumps the log files inside the app
        env:
          - name: GEMINI_API_KEY
            valueFrom:
              secretKeyRef:
                name: tacklebox-secrets
                key: GEMINI_API_KEY
          - name: MONGO_USER
            valueFrom:
              secretKeyRef:
                name: tacklebox-secrets
                key: MONGO_ROOT_USER
          - name: MONGO_PASS
            valueFrom:
              secretKeyRef:
                name: tacklebox-secrets
                key: MONGO_ROOT_PASSWORD
          - name: MONGO_HOST
            value: "mongodb-service"
      
      # 🛠️ CORRECTLY PLACED INDENTATION: Safely outside the container array, inside the Pod spec
      volumes:
      - name: backend-log-storage
        persistentVolumeClaim:
          claimName: log-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: tacklebox-service
spec:
  type: LoadBalancer
  ports:
  - port: 8585
    targetPort: 3000
  selector:
    app: "tacklebox"